# A private PipeWire for the headless test: one fake "Test Speakers" sink and
# a PulseAudio socket (what GNOME's volume controls talk to). No ALSA,
# Bluetooth or D-Bus modules, so it never touches real sound hardware or the
# desktop's own PipeWire.
#
# usage: pipewire -c dev/pipewire-test.conf   (with an isolated XDG_RUNTIME_DIR)

context.properties = {
    core.daemon = true
    core.name = pipewire-0
    default.clock.rate = 48000
    support.dbus = false
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-protocol-native }
    # Grants clients their permissions; without it they connect and hang.
    { name = libpipewire-module-access }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-protocol-pulse
      args = { server.address = [ "unix:native" ] } }
]

context.objects = [
    { factory = spa-node-factory
      args = {
          factory.name    = support.node.driver
          node.name       = notch-test-driver
          priority.driver = 8000
      }
    }
    { factory = adapter
      args = {
          factory.name            = support.null-audio-sink
          node.name               = notch-test-speakers
          node.description        = "Test Speakers"
          media.class             = Audio/Sink
          audio.position          = [ FL FR ]
          monitor.channel-volumes = true
          object.linger           = true
      }
    }
    { factory = metadata
      args = {
          metadata.name = default
          metadata.values = [
              { key = default.audio.sink value = { name = notch-test-speakers } }
          ]
      }
    }
]
